name: Ingest

# Ingest runs HERE, not in Vercel Cron. Vercel caps a cron invocation at 300
# seconds and a full two-marketplace keyword sweep exceeds it (known trap 4).
# The Vercel route (/api/cron/refresh) is a manual trigger and the cache
# revalidation hook only.
on:
  schedule:
    # Every 3 hours. Offers carry a 6-hour TTL on eBay and 24 on Amazon, so a
    # missed run is survivable; two consecutive misses start emptying the
    # table, which is the intended behaviour rather than serving stale prices.
    - cron: '17 */3 * * *'
  workflow_dispatch:

concurrency:
  # Never overlap sweeps: two writers racing on the same upsert keys would
  # produce spurious PricePoint rows.
  group: ingest
  cancel-in-progress: false

# The default token is read-only on this repository, so the failure handler
# below — which is the whole alerting mechanism — was silently 403ing on every
# run. issues:write is the permission it needs; contents:read is what checkout
# needs, and naming it keeps the rest of the token narrow.
permissions:
  contents: read
  issues: write

jobs:
  ingest:
    name: Sweep and refresh
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Before the site is deployed there is no database to sweep into, and
      # every one of the eight daily runs failed on `prisma migrate deploy`.
      # That is not an outage, and treating it as one is actively harmful: an
      # alert that fires eight times a day for a known non-problem is an alert
      # nobody reads, and the thing it exists to catch — a sweep that stops
      # working once the site is live — looks exactly the same.
      #
      # The safety property is that this can only ever skip an UNCONFIGURED
      # deployment. Once DATABASE_URL exists the job takes the real path on
      # every run, so a genuine failure still alerts. The skip is a warning
      # rather than a notice so it stays visible in the run list.
      - name: Check the deployment is configured
        id: configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo "::warning title=Ingest skipped::DATABASE_URL is not set, so there is no database to sweep into. This is the expected state before the site is deployed. Set the DATABASE_URL secret to enable the 3-hourly sweep."
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.configured.outputs.ready == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.configured.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.configured.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.configured.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        if: steps.configured.outputs.ready == 'true'
        run: pnpm db:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Ingest
        if: steps.configured.outputs.ready == 'true'
        run: pnpm ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

          MOCK_DATA: 'false'

          # eBay is the primary source and the differentiator.
          EBAY_ENABLED: ${{ vars.EBAY_ENABLED || 'false' }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_MARKETPLACE_ID: ${{ vars.EBAY_MARKETPLACE_ID || 'EBAY_US' }}
          EPN_CAMPAIGN_ID: ${{ secrets.EPN_CAMPAIGN_ID }}
          EPN_ROTATION_ID: ${{ vars.EPN_ROTATION_ID }}
          EBAY_MIN_FEEDBACK_PCT: ${{ vars.EBAY_MIN_FEEDBACK_PCT || '98.5' }}
          EBAY_MIN_FEEDBACK_COUNT: ${{ vars.EBAY_MIN_FEEDBACK_COUNT || '50' }}

          # A sweep that succeeds but writes almost nothing is the failure this
          # job cannot otherwise tell you about: the table empties on its own
          # six hours later and nothing raises a hand. Below the floor the run
          # exits non-zero and reports to Sentry.
          INGEST_MIN_OFFERS: ${{ vars.INGEST_MIN_OFFERS || '50' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

          # Amazon stays false until the account has 10 qualifying sales in the
          # trailing 30 days. A run with this off is a NORMAL run, not a
          # degraded one — see CLAUDE.md §1.4.
          AMAZON_ENABLED: ${{ vars.AMAZON_ENABLED || 'false' }}
          AMAZON_CREDENTIAL_ID: ${{ secrets.AMAZON_CREDENTIAL_ID }}
          AMAZON_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREDENTIAL_SECRET }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          AMAZON_MARKETPLACE: ${{ vars.AMAZON_MARKETPLACE || 'www.amazon.com' }}

          # revalidateTag cannot be called from outside the deployment
          # (known trap 11), so the job posts to an authenticated route.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}

      # A failed sweep is not cosmetic: offers expire on a 6-hour TTL, so two
      # consecutive failures start emptying the table.
      #
      # ONE issue per outage, not one per sweep. At eight sweeps a day an
      # undeduplicated handler buries the signal it exists to raise, and an
      # inbox of identical issues gets muted — after which the alert is worse
      # than useless, because it looks like it is working. Subsequent failures
      # comment on the open issue instead, so the thread shows how long the
      # outage has been running. Closing the issue arms it again.
      - name: Report failure
        if: failure() && steps.configured.outputs.ready == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const at = `${new Date().toISOString().slice(0, 16).replace('T', ' ')}Z`;

            const body = [
              `The 3-hourly ingest sweep failed at ${at}.`,
              '',
              `Run: ${run}`,
              '',
              'Offers carry a 6-hour TTL on eBay and 24 hours on Amazon, and the',
              'ingest job hard-deletes anything past its expiry. Two consecutive',
              'failures will start emptying the table — that is correct behaviour',
              'under the 24-hour rule, not a bug to work around.',
            ].join('\n');

            const open = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'ingest-failure',
              per_page: 1,
            });

            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: open.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: `Ingest failing since ${at}`,
                body,
                labels: ['ingest-failure'],
              });
            }
