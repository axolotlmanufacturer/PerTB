name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI runs entirely on the mock adapter. No marketplace credential is ever
  # needed to prove the build is sound, and the site must work without them.
  MOCK_DATA: 'true'
  AMAZON_ENABLED: 'false'
  EBAY_ENABLED: 'false'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  static:
    name: Typecheck, lint, unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Prisma schema valid
        run: pnpm exec prisma validate
        env:
          # Migrate reads the URL from prisma.config.ts; validate never
          # connects, so any well-formed URL satisfies it.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      # Coverage, not plain `test`: the Phase 1 gate on normalize.ts and
      # pricing.ts is a threshold in vitest.config.mts, and running without
      # --coverage would skip it silently.
      - name: Unit tests and coverage gate
        run: pnpm test:coverage

  e2e:
    name: Build and e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Build is its own step so a build failure is distinguishable from a
      # test failure. playwright.config.ts serves the built output in CI.
      - name: Build
        run: pnpm build

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
